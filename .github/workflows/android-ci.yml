name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No gradle-wrapper.jar is committed, so install Gradle 8.9 directly (matches gradle-wrapper.properties).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle testDebugUnitTest --continue --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # Compiles the instrumented tests too (they need an emulator to run, so CI only checks they build).
      - name: Compile instrumented tests
        run: gradle assembleDebugAndroidTest --stacktrace

      - name: Lint (report only)
        continue-on-error: true
        run: gradle lintDebug

      - name: Summarize results
        if: always()
        run: python3 .github/scripts/summarize.py

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: level-up-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
